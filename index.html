<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saloon – A Musical Journey</title>
  <meta name="description"
    content="– A nostalgic, cinematic Indian music listening experience. Immerse yourself in the warmth of Satrang Music." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* ============================================================
       BACKGROUND LAYER
    ============================================================ */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: url('images/background.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* Subtle dark vignette to help readability without killing the art */
    #bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.38) 100%);
    }

    /* ============================================================
       MAIN WRAPPER
    ============================================================ */
    #app {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* ============================================================
       TOP HEADER
    ============================================================ */
    #header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      pointer-events: none;
    }

    #header>* {
      pointer-events: auto;
    }

    /* --- Clock --- */
    #clock {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.90);
      letter-spacing: 0.04em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      min-width: 90px;
    }

    /* --- Online indicator --- */
    #online-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 40px;
      padding: 6px 14px 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    #online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e879;
      box-shadow: 0 0 8px 2px rgba(0, 232, 121, 0.70);
      animation: pulse-dot 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        box-shadow: 0 0 8px 2px rgba(0, 232, 121, 0.70);
      }

      50% {
        box-shadow: 0 0 14px 4px rgba(0, 232, 121, 0.95);
      }
    }

    #online-text {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* --- External links --- */
    #ext-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ext-link {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.88);
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 6px 13px 6px 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: background 0.22s, transform 0.18s, border-color 0.22s;
    }

    .ext-link:hover {
      background: rgba(0, 0, 0, 0.46);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .ext-link-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .spotify-icon {
      background: #1DB954;
    }

    .ytmusic-icon {
      background: #FF0000;
    }

    .ext-link-arrow {
      font-size: 11px;
      opacity: 0.65;
    }

    /* ============================================================
       MAIN TITLE (Devanagari)
    ============================================================ */
    #main-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -62%);
      z-index: 15;
      text-align: center;
      pointer-events: none;
      line-height: 0.92;
    }

    #main-title h1 {
      font-family: 'Noto Serif Devanagari', 'Nirmala UI', 'Mangal', serif;
      font-weight: 900;
      color: #ffffff;
      text-shadow:
        0 2px 0px rgba(120, 40, 10, 0.6),
        0 4px 18px rgba(0, 0, 0, 0.55),
        0 8px 40px rgba(0, 0, 0, 0.38);
      font-size: clamp(80px, 14vw, 148px);
      letter-spacing: -0.01em;
    }

    /* ============================================================
       MUSIC PLAYER
    ============================================================ */

    #player-wrap {
      position: absolute !important;
      width: 700px !important;
      height: 115px !important;
      bottom: 70px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 100 !important;
    }


    #player {
      width: 100% !important;
      height: 100% !important;

      /* MUCH MORE TRANSPARENT */
      /* background: rgba(105, 55, 42, 0.30) !important; */
      background: rgba(120, 60, 45, 0.34) !important;

      /* Frosted glass */
      backdrop-filter: blur(25px) saturate(140%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(140%) !important;

      /* Glass edge */
      border: 1px solid rgba(255, 255, 255, 0.28) !important;

      border-radius: 60px !important;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08) !important;

      padding: 10px 18px 10px 7px !important;

      display: flex !important;
      align-items: center !important;
      gap: 15px !important;

      position: relative !important;
      overflow: hidden !important;
    }

    /* Glass reflection */
    #player::before {
      content: "" !important;
      position: absolute !important;
      inset: 0 !important;

      background: linear-gradient(
        120deg,
        rgba(255,255,255,0.16),
        rgba(255,255,255,0.04) 35%,
        transparent 65%
      ) !important;

      border-radius: inherit !important;
      pointer-events: none !important;
    }

    /* Keep player content above glass reflection */
    #player > * {
      position: relative;
      z-index: 2;
    }


    #album-art {
      /* width: 100px;
      height: 100px; */
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.40),
        0 0 0 1px rgba(0, 0, 0, 0.12);
      animation: albumSpin 7s linear infinite;
      animation-play-state: paused;
    }

    @keyframes albumSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #album-art.spinning {
      animation-play-state: running;
    }

    #album-art-wrap::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .linkedin-icon {
      background: #0A66C2 !important;
    }

    /* --- Player Content --- */
    #player-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      min-width: 0;
      height: 100%;
      padding: 2px 0;
    }

    #song-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #song-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    #song-artist {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.70);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.015em;
    }

    /* --- Progress Row --- */
    #progress-row {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 4px 17px;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .time-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.02em;
      flex-shrink: 0;
      min-width: 32px;
    }

    #time-current,
    #time-total {
      font-size: 12px;
      line-height: 17px;
    }

    #time-current {
      grid-column: 1;
      grid-row: 2;
      text-align: left;
      min-width: 0;
    }

    #time-total {
      position: absolute;
      left: 0;
      bottom: -1px;
      transform: translateX(0);
      text-align: left;
      margin-left: 0;
    }

    #progress-bar-wrap {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: visible;
    }

    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffe0b2, #ffb74d);
      border-radius: 4px;
      transition: width 0.25s linear;
      position: relative;
    }

    #progress-bar-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.15s;
    }

    #progress-bar-wrap:hover #progress-bar-fill::after {
      opacity: 1;
    }


    /* --- File Fallback --- */
    #file-fallback {
      display: none;
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 20, 10, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 12px 18px;
      text-align: center;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    #file-fallback p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.80);
      margin-bottom: 8px;
    }

    #file-input {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.80);
      cursor: pointer;
    }

    /* --- Error message --- */
    #error-msg {
      display: none;
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(90, 20, 20, 0.92);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px;
      color: #ffcccc;
      white-space: nowrap;
      pointer-events: none;
    }

    .time-readout {
      position: relative;
      width: 100%;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .time-readout .time-label {
      min-width: 0;
    }

    #time-total {
      position: static;
      transform: none;
      margin-left: auto;
      text-align: right;
    }

    #controls-row {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 132px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s, opacity 0.18s;
      color: rgba(255, 255, 255, 0.88);
      padding: 0;
      flex-shrink: 0;
    }

    .skip-btn {
      width: 30px;
      height: 40px;
      opacity: 0.78;
    }

    .skip-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    #play-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28), 0 1px 4px rgba(0, 0, 0, 0.16);
      color: #8a3b22;
    }

    #play-btn svg {
      width: 25px;
      height: 25px;
      fill: #8a3b22;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 900px) {
      #header {
        padding: 14px 18px;
      }

      #clock {
        font-size: 13px;
      }

      #online-text {
        font-size: 12px;
      }

      .ext-link {
        font-size: 12px;
        padding: 5px 10px 5px 6px;
        gap: 5px;
      }

      .ext-link-icon {
        width: 20px;
        height: 20px;
      }

      #main-title h1 {
        font-size: clamp(68px, 18vw, 110px);
      }

      #player-wrap {
        bottom: 24px;
        width: min(775px, calc(100vw - 28px));
        height: 122px;
      }

      #player {
        padding: 12px 16px 12px 10px;
        border-radius: 62px;
        gap: 12px;
      }

      #album-art {
        width: 82px;
        height: 82px;
      }

      #song-title {
        font-size: 15px;
      }

      #song-artist {
        font-size: 12px;
      }

      #controls-row {
        width: 112px;
        gap: 8px;
      }

      #play-btn {
        width: 54px;
        height: 54px;
      }

      #play-btn svg {
        width: 22px;
        height: 22px;
      }

      .skip-btn {
        width: 26px;
        height: 36px;
      }

      .skip-btn svg {
        width: 19px;
        height: 19px;
      }
    }

    @media (max-width: 520px) {
      #header {
        padding: 10px 14px;
      }

      #main-title {
        transform: translate(-50%, -58%);
      }

      #online-badge {
        padding: 5px 10px 5px 8px;
      }

      .ext-link .link-label {
        display: none;
      }

      .ext-link {
        padding: 5px 8px;
      }

      #player-wrap {
        bottom: 16px;
        height: 104px;
      }

      #player {
        padding: 10px 12px 10px 8px;
        border-radius: 52px;
        gap: 9px;
      }

      #album-art {
        width: 70px;
        height: 70px;
      }

      #controls-row {
        width: 92px;
        gap: 5px;
      }

      #play-btn {
        width: 46px;
        height: 46px;
      }

      #play-btn svg {
        width: 18px;
        height: 18px;
      }

      .skip-btn {
        width: 22px;
        height: 30px;
      }

      .skip-btn svg {
        width: 17px;
        height: 17px;
      }
    }
  </style>
</head>

            <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  </div>

  <!-- HTML5 Audio Engine -->
  <audio id="audio" preload="metadata"></audio>

  <script>
    'use strict';

    /* ==========================================================
       CONFIGURATION
    ========================================================== */
    const CONFIG = {
      defaultTrack: 0,
      spotifySearch: 'https://open.spotify.com/search/Mujhse%20Mohabbat%20Ka%20Izhaar%20Karta',
      ytMusicSearch: 'https://music.youtube.com/search?q=Mujhse%20Mohabbat%20Ka%20Izhaar%20Karta',
      onlineRange: { min: 27, max: 34 },
      onlineInterval: 4200,
      clockInterval: 1000,
    };

    /* ==========================================================
       PLAYLIST
       Add more tracks here. Each needs: title, artist, src, thumbnail.
    ========================================================== */
    const playlist = [
      {
        title: "Kitna Haseen Chehra (From _Dilwale_)",
        artist: "Satrang Music Official",
        src: "audio/20. Kitna Haseen Chehra (From _Dilwale_).mp3",
        thumbnail: "images/1.jpg"
      },

      {
        title: "Tujhko Na Dekhun (From _Jaanwar_)",
        artist: "Kumar Sanu",
        src: "audio/21. Tujhko Na Dekhun (From _Jaanwar_).mp3",
        thumbnail: "images/2.jpg"
      },

      {
        title: "Tum Se Achcha Kaun Hai Chand Tare Phool",
        artist: "Kumar Sanu, Alka Yagnik",
        src: "audio/22. Tum Se Achcha Kaun Hai Chand Tare Phool.mp3",
        thumbnail: "images/3.jpg"
      },

      {
        title: "Tum Dil Ki Dhadkan Mein (From _Dhadkan_)",
        artist: "Kumar Sanu",
        src: "audio/23. Tum Dil Ki Dhadkan Mein (From _Dhadkan_).mp3",
        thumbnail: "images/4.jpg"
      },

      {
        title: "Sab Kuchh Bhula Diya (Female)",
        artist: "Kumar Sanu",
        src: "audio/25. Sab Kuchh Bhula Diya (Female).mp3",
        thumbnail: "images/5.jpg"
      },

      {
        title: "Dheere Dheere Pyar Ko",
        artist: "Kumar Sanu",
        src: "audio/26. Dheere Dheere Pyar Ko.mp3",
        thumbnail: "images/6.jpg"
      },

      {
        title: "Jeeye to Jeeye Kaise",
        artist: "Kumar Sanu, Alka Yagnik",
        src: "audio/28. Jeeye to Jeeye Kaise.mp3",
        thumbnail: "images/7.jpg"
      },

      {
        title: "Hum Laakh Chupaye",
        artist: "Kumar Sanu, Anuradha Paudwal",
        src: "audio/29. Hum Laakh Chupaye.mp3",
        thumbnail: "images/8.jpg"
      },

      {
        title: "Nahin Yeh Ho Nahin Sakta",
        artist: "Kumar Sanu, Lata Mangeshkar",
        src: "audio/30. Nahin Yeh Ho Nahin Sakta.mp3",
        thumbnail: "images/9.jpg"
      },

      {
        title: "Kahin Mujhe Pyar Hua Toh Nahin",
        artist: "Anuradha Paudwal",
        src: "audio/31. Kahin Mujhe Pyar Hua Toh Nahin.mp3",
        thumbnail: "images/10.jpg"
      },

      {
        title: "Tera Naam Liya",
        artist: "Kumar Sanu",
        src: "audio/32. Tera Naam Liya.mp3",
        thumbnail: "images/11.jpg"
      },

      {
        title: "Kitna Pyaara Tujhe Rabne Banaya",
        artist: "Kumar Sanu",
        src: "audio/33. Kitna Pyaara Tujhe Rabne Banaya.mp3",
        thumbnail: "images/12.jpg"
      },

      {
        title: "Hum Pyaar Hai Tumhare",
        artist: "Shaan",
        src: "audio/34. Hum Pyaar Hai Tumhare.mp3",
        thumbnail: "images/13.jpg"
      },

      {
        title: "Ek Ladki Ko Dekha",
        artist: "Udit Narayan",
        src: "audio/35. Ek Ladki Ko Dekha.mp3",
        thumbnail: "images/14.jpg"
      }
    ];

    /* ==========================================================
       STATE
    ========================================================== */
    let currentIndex = CONFIG.defaultTrack;
    let isPlaying = false;
    let audioFailed = false;
    let onlineCount = 31;

    /* ==========================================================
       DOM
    ========================================================== */
    const audio = document.getElementById('audio');
    const albumArt = document.getElementById('album-art');
    const songTitleEl = document.getElementById('song-title');
    const songArtistEl = document.getElementById('song-artist');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const progressWrap = document.getElementById('progress-bar-wrap');
    const progressFill = document.getElementById('progress-bar-fill');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const clockEl = document.getElementById('clock');
    const onlineText = document.getElementById('online-text');
    const fileFallback = document.getElementById('file-fallback');
    const fileInput = document.getElementById('file-input');
    const errorMsg = document.getElementById('error-msg');

    /* ==========================================================
       UTILITIES
    ========================================================== */
    function formatTime(secs) {
      if (!isFinite(secs) || isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    /* ==========================================================
       CLOCK
    ========================================================== */
    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const min = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      clockEl.textContent = `${h}:${min < 10 ? '0' : ''}${min} ${ampm}`;
    }

    /* ==========================================================
       ONLINE COUNT SIMULATION
       ⚠️  FRONTEND SIMULATION ONLY — not a real visitor count.
           Actual global counts need a backend (WebSocket / Firebase).
    ========================================================== */
    function updateOnlineCount() {
      const { min, max } = CONFIG.onlineRange;
      const delta = Math.random() < 0.5 ? -1 : 1;
      onlineCount = Math.min(max, Math.max(min, onlineCount + delta));
      onlineText.textContent = `${onlineCount} online`;
    }

    /* ==========================================================
       LOAD TRACK
    ========================================================== */
    function loadTrack(index) {
      const track = playlist[index];
      if (!track) return;

      audioFailed = false;
      hideError();

      songTitleEl.textContent = track.title;
      songArtistEl.textContent = track.artist;
      albumArt.src = track.thumbnail;
      albumArt.alt = `${track.title} – album art`;

      progressFill.style.width = '0%';
      progressWrap.setAttribute('aria-valuenow', 0);
      timeCurrent.textContent = '0:00';
      timeTotal.textContent = '0:00';

      audio.src = track.src;
      audio.load();
    }

    /* ==========================================================
       PLAY
    ========================================================== */
    function playTrack() {
      if (audioFailed) { showFileFallback(); return; }

      const promise = audio.play();
      if (promise !== undefined) {
        promise.catch(err => {
          if (err.name === 'NotSupportedError') {
            audioFailed = true;
            showFileFallback();
          } else if (err.name !== 'AbortError') {
            showError('Unable to play this song.');
          }
        });
      }
    }

    /* ==========================================================
       PAUSE
    ========================================================== */
    function pauseTrack() {
      audio.pause();
    }

    /* ==========================================================
       NEXT TRACK
    ========================================================== */
    function nextTrack() {
      if (playlist.length > 1) {
        currentIndex = (currentIndex + 1) % playlist.length;
        loadTrack(currentIndex);
        if (isPlaying) playTrack();
      } else {
        audio.currentTime = Math.min(
          isFinite(audio.duration) ? audio.duration : 0,
          audio.currentTime + 10
        );
      }
    }

    /* ==========================================================
       PREVIOUS TRACK
    ========================================================== */
    function previousTrack() {
      if (playlist.length > 1) {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        loadTrack(currentIndex);
        if (isPlaying) playTrack();
      } else {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      }
    }

    /* ==========================================================
       PROGRESS
    ========================================================== */
    function updateProgress() {
      const cur = audio.currentTime;
      const dur = audio.duration;
      timeCurrent.textContent = formatTime(cur);
      if (isFinite(dur) && dur > 0) {
        const pct = (cur / dur) * 100;
        progressFill.style.width = `${pct}%`;
        progressWrap.setAttribute('aria-valuenow', Math.round(pct));
      }
    }

    function seek(e) {
      const rect = progressWrap.getBoundingClientRect();
      const clickX = (e.type === 'touchstart')
        ? e.touches[0].clientX - rect.left
        : e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      if (isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = pct * audio.duration;
      }
    }

    /* ==========================================================
       UI STATE
    ========================================================== */
    function updatePlayerUI() {
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = '';
        playBtn.setAttribute('aria-label', 'Pause');
        albumArt.classList.add('spinning');
      } else {
        playIcon.style.display = '';
        pauseIcon.style.display = 'none';
        playBtn.setAttribute('aria-label', 'Play');
        albumArt.classList.remove('spinning');
      }
    }

    /* ==========================================================
       FALLBACK & ERROR
    ========================================================== */
    function showFileFallback() { fileFallback.style.display = 'block'; }
    function hideFileFallback() { fileFallback.style.display = 'none'; }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      setTimeout(() => { errorMsg.style.display = 'none'; }, 4000);
    }

    function hideError() { errorMsg.style.display = 'none'; }

    /* ==========================================================
       EVENTS — Controls
    ========================================================== */
    playBtn.addEventListener('click', () => {
      isPlaying ? pauseTrack() : playTrack();
    });

    prevBtn.addEventListener('click', previousTrack);
    nextBtn.addEventListener('click', nextTrack);

    progressWrap.addEventListener('click', seek);
    progressWrap.addEventListener('touchstart', seek, { passive: true });

    progressWrap.addEventListener('keydown', (e) => {
      if (!isFinite(audio.duration)) return;
      if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
    });

    /* ==========================================================
       EVENTS — Audio
    ========================================================== */
    audio.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('play', () => {
      isPlaying = true;
      updatePlayerUI();
      hideFileFallback();
      hideError();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      updatePlayerUI();
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      updatePlayerUI();
      if (playlist.length > 1) {
        currentIndex = (currentIndex + 1) % playlist.length;
        loadTrack(currentIndex);
        playTrack();
      } else {
        audio.currentTime = 0;
        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
      }
    });

    audio.addEventListener('error', () => {
      audioFailed = true;
    });

    /* ==========================================================
       FILE INPUT FALLBACK
    ========================================================== */
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      audio.src = URL.createObjectURL(file);
      audioFailed = false;

      const name = file.name.replace(/\.[^.]+$/, '');
      songTitleEl.textContent = name;
      songArtistEl.textContent = 'Local File';

      audio.load();
      audio.addEventListener('loadedmetadata', () => { playTrack(); }, { once: true });
      hideFileFallback();
    });

    /* ==========================================================
       INIT
    ========================================================== */
    function init() {
      loadTrack(CONFIG.defaultTrack);

      updateClock();
      setInterval(updateClock, CONFIG.clockInterval);

      updateOnlineCount();
      setInterval(updateOnlineCount, CONFIG.onlineInterval);
    }

    init();
  </script>
